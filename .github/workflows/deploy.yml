name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build
        env:
          NODE_ENV: production

      - name: Deploy via wrangler + Promote to Production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "=== Step 1: Deploy with wrangler ==="
          DEPLOY_OUTPUT=$(npx wrangler@3 pages deploy dist --project-name=cotizador-pro --branch=main 2>&1)
          echo "$DEPLOY_OUTPUT"

          # Extract deployment ID from URL (e.g. https://abc12345.cotizador-pro.pages.dev)
          DEPLOY_URL=$(echo "$DEPLOY_OUTPUT" | grep -oP 'https://[a-f0-9-]+\.cotizador-pro\.pages\.dev' | head -1)
          DEPLOY_SHORT_ID=$(echo "$DEPLOY_URL" | sed 's|https://||;s|\.cotizador-pro\.pages\.dev||')
          echo "  Deploy URL: $DEPLOY_URL"
          echo "  Deploy short ID: $DEPLOY_SHORT_ID"

          echo ""
          echo "=== Step 2: Find deployment ID ==="
          DEPLOY_ID=$(curl -s \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/cotizador-pro/deployments?per_page=5" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          if d.get('success'):
              for dep in d.get('result', []):
                  if dep.get('short_id', '').startswith('$DEPLOY_SHORT_ID') or '$DEPLOY_SHORT_ID' in dep.get('id', ''):
                      print(dep['id'])
                      break
              else:
                  print(d['result'][0]['id'] if d.get('result') else 'NOT_FOUND')
          else:
              print('ERROR')
          ")
          echo "  Deployment ID: $DEPLOY_ID"

          echo ""
          echo "=== Step 3: Promote to production ==="
          # Try PATCH with is_production
          PROMOTE_RESULT=$(curl -s -X PATCH \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/cotizador-pro/deployments/$DEPLOY_ID" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"is_production": true, "deployment_trigger": {"type": "manual", "metadata": {"branch": "main"}}}')
          echo "$PROMOTE_RESULT" | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          if d.get('success'):
              dep = d.get('result', {})
              print(f'  is_production: {dep.get(\"is_production\")}')
              print(f'  url: {dep.get(\"url\")}')
          else:
              print(f'  PATCH result: success={d.get(\"success\")}')
              print(f'  Errors: {d.get(\"errors\", [])}')
          "

          echo ""
          echo "=== Step 4: Verify ==="
          sleep 5
          curl -s \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/cotizador-pro/deployments?per_page=3" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          for dep in d.get('result', []):
              is_prod = dep.get('is_production')
              marker = '>>> PRODUCTION <<<' if is_prod else 'preview'
              branch = dep.get('deployment_trigger', {}).get('metadata', {}).get('branch', '?')
              print(f'  [{marker:20s}] branch={branch}  url={dep.get(\"url\",\"?\")}')

          print()
          print('  === Live site check ===')
          import urllib.request
          try:
              req = urllib.request.Request('https://cotizador-pro.pages.dev/app.html')
              with urllib.request.urlopen(req, timeout=15) as resp:
                  html = resp.read().decode('utf-8')
                  import re
                  js = re.search(r'app-[^\"]+\.js', html)
                  print(f'  cotizador-pro.pages.dev => JS: {js.group(0) if js else \"NOT FOUND\"}  HTTP 200')
          except Exception as e:
              print(f'  Error: {e}')
          "

      - name: Purge Cloudflare Cache
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          curl -s -X POST "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/cotizador-pro/cache" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"files":["/*"]}' | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          print(f'  Cache purge: {\"success\" if d.get(\"success\") else d.get(\"errors\", \"unknown\")}')
          "
