name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build
        env:
          NODE_ENV: production

      - name: Ensure Production Branch = main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "=== Verifying production_branch ==="
          curl -s -X PATCH \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/cotizador-pro" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"production_branch":"main"}' | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          if d.get('success'):
              print(f'  production_branch: {d[\"result\"].get(\"production_branch\")}')
          else:
              print(f'  WARNING: {d.get(\"errors\",[])}')
          "

      - name: Deploy to Cloudflare Pages (Production)
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: cotizador-pro
          directory: dist
          branch: main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Production Deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "=== Checking if deployment is now PRODUCTION ==="
          sleep 10
          curl -s \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/cotizador-pro/deployments?per_page=3" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          for dep in d.get('result', []):
              is_prod = dep.get('is_production')
              branch = dep.get('deployment_trigger', {}).get('metadata', {}).get('branch', '?')
              url = dep.get('url', '?')
              status = '>>> PRODUCTION <<<' if is_prod else 'preview'
              print(f'  [{status:20s}] branch={branch}  url={url}  id={dep.get(\"id\",\"?\")[:12]}')
          "
          echo ""
          echo "=== Checking live site ==="
          HTTP_CODE=$(curl -sL -o /dev/null -w "%{http_code}" "https://cotizador-pro.pages.dev/app.html")
          JS_BUNDLE=$(curl -sL "https://cotizador-pro.pages.dev/app.html" | grep -oP 'app-[^"]+\.js' | head -1)
          echo "  cotizador-pro.pages.dev => HTTP $HTTP_CODE | JS: $JS_BUNDLE"
